<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#hnGrad)"/>
  <!-- Operational status dot in top-right corner -->
  <circle cx="53" cy="11" r="4.5" fill="#10B981" stroke="#080C14" stroke-width="1.5"/>
  <g transform="translate(8, 8) scale(2.0)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Boy's Hair -->
    <path d="M6 8c-.3-4.2 2.5-6 6-6s6.3 1.8 6 6" stroke-width="1.85"/>
    <path d="M12.8 2.2c.6-.9 1.5-.8 2 0" stroke-width="1.6"/>
    <path d="M6 7.5c1.8-1 3.5-.8 5 .2 2 1.2 4.2-.6 6.8.6" stroke-width="1.75"/>
    <!-- Jawline & Face contour -->
    <path d="M7.2 8.5v2a4.8 4.8 0 0 0 9.6 0v-2" stroke-width="1.85"/>
    <!-- Ears -->
    <path d="M6.8 9.2a1.2 1.2 0 0 0 0 2" stroke-width="1.6"/>
    <path d="M17.2 9.2a1.2 1.2 0 0 1 0 2" stroke-width="1.6"/>
    <!-- Eyes & Smile -->
    <circle cx="9.5" cy="9.6" r="0.85" fill="#FFFFFF" stroke="none"/>
    <circle cx="14.5" cy="9.6" r="0.85" fill="#FFFFFF" stroke="none"/>
    <path d="M11 12.3a1.4 1.4 0 0 0 2 0" stroke-width="1.4"/>
    <!-- Neck & Collar -->
    <path d="M10.2 13.5v1.3" stroke-width="1.4"/>
    <path d="M13.8 13.5v1.3" stroke-width="1.4"/>
    <path d="M10 14.8a2 2 0 0 0 4 0" stroke-width="1.6"/>
    <!-- Torso & Shoulders -->
    <path d="M4.5 21.5c.2-3.8 2.5-6.2 5.5-6.8" stroke-width="1.8"/>
    <path d="M19.5 21.5c-.2-3.8-2.5-6.2-5.5-6.8" stroke-width="1.8"/>
    <!-- Laptop in foreground -->
    <rect x="6" y="15.8" width="12" height="5.7" rx="1.3" fill="rgba(8,12,20,0.35)" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="12" cy="18.6" r="0.9" fill="#FFFFFF" stroke="none"/>
    <!-- Grounding Laptop Base -->
    <line x1="4.2" y1="21.5" x2="19.8" y2="21.5" stroke-width="2.2"/>
